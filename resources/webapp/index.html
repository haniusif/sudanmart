<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سودان مارت · Sudan Mart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════ Sudan Mart — design tokens ═══════════════ */
:root{
  --green-900:#0A3527; --green-800:#0F4D3A; --green-700:#14654C; --green-500:#2B7A5D; --green-100:#D7E8E0; --green-50:#ECF4EF;
  --gold-700:#A98232; --gold-600:#C9A24B; --gold-500:#D9B662; --gold-300:#E5C97A; --gold-100:#F5E9C3;
  --terra-700:#8E3A22; --terra-600:#B0492C; --terra-500:#C95A2F; --terra-100:#F4D8C9;
  --sand-50:#FCFAF4; --sand-100:#FAF6EE; --sand-200:#F2EADA; --sand-300:#E8DCC4; --sand-400:#D6C5A4;
  --bg:var(--sand-100); --bg-elev:#FFFFFF; --surface:#FFFFFF; --surface-2:var(--sand-50); --surface-3:var(--sand-200);
  --border:rgba(26,20,16,.08); --border-strong:rgba(26,20,16,.14);
  --text:#1A1410; --text-2:#4A3F35; --text-3:#8B7D6E; --text-4:#B8AC9C;
  --primary:var(--green-800); --primary-ink:#FFFFFF; --accent:var(--gold-600);
  --danger:#C2392C; --success:#2E8A5D; --warning:#D69824;
  --shadow-sm:0 1px 2px rgba(26,20,16,.04),0 2px 6px rgba(26,20,16,.05);
  --shadow-md:0 2px 6px rgba(26,20,16,.05),0 12px 28px rgba(26,20,16,.08);
  --shadow-lg:0 6px 16px rgba(26,20,16,.08),0 24px 60px rgba(26,20,16,.14);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px;
  --maxw:1240px;
}
:root[data-theme='dark']{
  --bg:#0E1410; --bg-elev:#161D18; --surface:#1A221D; --surface-2:#222B25; --surface-3:#2B362F;
  --border:rgba(255,245,224,.08); --border-strong:rgba(255,245,224,.16);
  --text:#F5F0E5; --text-2:#CFC6B5; --text-3:#8B8275; --text-4:#5E574C;
  --primary:#2E8A66; --primary-ink:#051410; --accent:var(--gold-500);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.25);
  --shadow-md:0 2px 6px rgba(0,0,0,.35),0 12px 28px rgba(0,0,0,.45);
  --shadow-lg:0 6px 16px rgba(0,0,0,.45),0 24px 60px rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Cairo','Tajawal',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5;
  min-height:100vh; font-feature-settings:'ss01','cv11';
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
img,svg{display:block}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
.en{font-family:'Tajawal',system-ui,sans-serif}
.muted{color:var(--text-3)}
.hide{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:700;font-size:15px;border:0;cursor:pointer;transition:transform .08s ease,opacity .15s ease,background .15s ease;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);color:var(--primary-ink);box-shadow:0 8px 22px -10px var(--primary)}
.btn.primary:hover{opacity:.92}
.btn.gold{background:var(--accent);color:#2a1f08}
.btn.outline{background:var(--surface);color:var(--text);border:1px solid var(--border-strong)}
.btn.outline:hover{border-color:var(--primary);color:var(--primary)}
.btn.ghost{background:transparent;color:var(--text)}
.btn.block{width:100%}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:11px}
.btn.lg{padding:15px 26px;font-size:16px;border-radius:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--border-strong)}
.chip.active{background:var(--primary);color:var(--primary-ink);border-color:transparent}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.pill.ok{background:color-mix(in oklab,var(--success) 14%,transparent);color:var(--success)}
.pill.warn{background:color-mix(in oklab,var(--warning) 18%,transparent);color:#8a6310}
.pill.gold{background:color-mix(in oklab,var(--accent) 22%,transparent);color:#6a4f10}
.pill.danger{background:color-mix(in oklab,var(--danger) 16%,transparent);color:var(--danger)}
.pill.info{background:color-mix(in oklab,var(--primary) 16%,transparent);color:var(--primary)}
[data-theme='dark'] .pill.warn{color:var(--warning)}
[data-theme='dark'] .pill.gold{color:var(--gold-300)}

.card{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--border)}

/* ═══════════════ Header ═══════════════ */
.topline{background:var(--green-900);color:#e9e1d2;font-size:12.5px}
.topline .wrap{display:flex;align-items:center;justify-content:space-between;height:40px}
.topline a{color:rgba(255,255,255,.72);cursor:pointer;transition:color .15s}
.topline a:hover{color:var(--gold-300)}
.tl-info{display:flex;align-items:center;gap:14px;min-width:0}
.tl-links{display:flex;align-items:center;gap:16px;flex-shrink:0}
.tl-item{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tl-dot{opacity:.35}
@media(max-width:900px){.tl-item.secondary{display:none}}
.header{position:sticky;top:0;z-index:50;background:color-mix(in oklab,var(--bg-elev) 92%,transparent);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid var(--border)}
.header .wrap{display:flex;align-items:center;gap:22px;height:76px}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.brand .bname{font-family:'Tajawal';font-weight:800;font-size:20px;letter-spacing:-.4px}
.brand .bsub{font-family:'Tajawal';font-weight:700;font-size:9.5px;color:var(--gold-700);letter-spacing:2px}
[data-theme='dark'] .brand .bsub{color:var(--gold-300)}
.searchbar{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:0 14px;height:46px;max-width:560px;transition:.15s}
.searchbar:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in oklab,var(--primary) 14%,transparent);background:var(--surface)}
.searchbar input{flex:1;border:0;background:transparent;outline:none;font-family:inherit;font-size:14.5px;color:var(--text)}
.hicons{display:flex;align-items:center;gap:6px;flex-shrink:0}
.iconbtn{position:relative;width:44px;height:44px;border-radius:13px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--text-2);transition:.15s}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.iconbtn .badge{position:absolute;top:5px;inset-inline-start:5px;min-width:18px;height:18px;padding:0 4px;background:var(--terra-600);color:#fff;font-size:10.5px;font-weight:800;border-radius:999px;display:grid;place-items:center;font-family:'Tajawal'}
.navrow{position:relative;background:var(--bg-elev);border-bottom:1px solid var(--border)}
.navrow .wrap{display:flex;align-items:center;justify-content:center;gap:4px;height:52px}
.navlink{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:11px;font-size:14px;font-weight:700;color:var(--text-2);cursor:pointer;white-space:nowrap;transition:.15s;border:0;background:transparent;font-family:inherit}
.navlink:hover{background:var(--surface-2);color:var(--text)}
.navlink.active{color:var(--primary);background:color-mix(in oklab,var(--primary) 10%,transparent)}
.navlink.allcats.open{background:var(--surface-2);color:var(--text)}
.navlink.allcats.open svg{transform:rotate(180deg)}
.navlink.allcats svg{transition:transform .2s}
/* mega menu */
.megamenu{display:none;position:absolute;top:100%;inset-inline:0;background:var(--bg-elev);border-bottom:1px solid var(--border);box-shadow:var(--shadow-lg);z-index:49}
.megamenu.open{display:block;animation:fade .2s ease both}
.mega-inner{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:20px 24px}
.megacell{display:flex;align-items:center;gap:11px;padding:11px;border-radius:14px;cursor:pointer;transition:.15s;border:1px solid transparent}
.megacell:hover{background:var(--surface-2);border-color:var(--border)}
.megacell .mci{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.megacell .mcn{font-size:14px;font-weight:700}
.megacell .mcc{font-size:11px;color:var(--text-4);font-family:'Tajawal';margin-top:1px}
@media(max-width:900px){.mega-inner{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.mega-inner{grid-template-columns:repeat(2,1fr)}}

/* ═══════════════ Hero ═══════════════ */
.hero{position:relative;border-radius:var(--r-xl);overflow:hidden;height:340px;margin-top:26px;color:#fff}
.hero-slide{position:absolute;inset:0;display:flex;align-items:center;padding:0 56px;opacity:0;transition:opacity .7s ease;pointer-events:none}
.hero-slide.on{opacity:1;pointer-events:auto}
.hero-slide .htxt{max-width:520px;position:relative;z-index:2}
.hero-slide .htag{display:inline-block;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;margin-bottom:16px}
.hero-slide h2{font-size:40px;font-weight:900;margin:0 0 12px;letter-spacing:-1px;line-height:1.15}
.hero-slide p{font-size:17px;opacity:.92;margin:0 0 24px;max-width:420px}
.hero-slide .deco{position:absolute;inset-inline-end:-40px;top:50%;transform:translateY(-50%);opacity:.22;z-index:1}
.hero-dots{position:absolute;bottom:20px;inset-inline-start:56px;display:flex;gap:8px;z-index:3}
.hero-dots span{width:9px;height:9px;border-radius:999px;background:rgba(255,255,255,.4);cursor:pointer;transition:.2s}
.hero-dots span.on{background:#fff;width:26px}

/* ═══════════════ Category strip ═══════════════ */
.section{margin-top:44px}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.sechead h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px}
.sechead .se{font-size:12px;font-weight:600;color:var(--text-3);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.sechead .more{color:var(--primary);font-size:14px;font-weight:700;cursor:pointer}
.catgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:12px}
.catcell{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px 8px;text-align:center;cursor:pointer;transition:.18s}
.catcell:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:transparent}
.catcell .ci{width:56px;height:56px;border-radius:16px;margin:0 auto 10px;display:grid;place-items:center}
.catcell .cn{font-size:13px;font-weight:700}
.catcell .cc{font-family:'Tajawal';font-size:10.5px;color:var(--text-4);margin-top:2px}

/* ═══════════════ Product grid & card ═══════════════ */
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;transition:.18s;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:transparent}
.pcard .part{position:relative;height:180px}
.pcard .favb{position:absolute;top:10px;inset-inline-start:10px;width:34px;height:34px;border-radius:999px;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow-sm);z-index:2;color:#1A1410}
.tagb{position:absolute;top:10px;inset-inline-end:10px;background:var(--terra-600);color:#fff;font-size:11px;font-weight:800;padding:4px 9px;border-radius:8px;font-family:'Tajawal';z-index:2}
.pcard .pbody{padding:14px;display:flex;flex-direction:column;flex:1}
.pcard .pname{font-size:14.5px;font-weight:700;line-height:1.35;margin-bottom:3px;min-height:39px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .pen{font-size:11px;color:var(--text-3);margin-bottom:6px}
.pcard .pseller{font-size:11px;color:var(--text-4);margin-bottom:10px;display:flex;align-items:center;gap:4px}
.pcard .prow{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.price{font-size:18px;font-weight:800;color:var(--primary)}
.price .cur{font-size:11px;font-weight:600}
.price.old{font-size:13px;color:var(--text-4);text-decoration:line-through;font-weight:600;margin-inline-start:6px}
.prate{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:700}
.prate .rc{color:var(--text-3);font-weight:600;font-family:'Tajawal'}
.addb{width:38px;height:38px;border-radius:12px;border:0;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;cursor:pointer;transition:.15s}
.addb:hover{transform:scale(1.08)}

/* product art */
.art{position:relative;height:100%;overflow:hidden;display:grid;place-items:center}
.art .glyph{opacity:.92}
.art-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.pcard:hover .art-img{transform:scale(1.05)}
.art-img{transition:transform .3s ease}
.tagb{z-index:2}

/* trust badges */
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:44px}
.tb{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;display:flex;align-items:center;gap:14px}
.tb .tbic{width:46px;height:46px;border-radius:13px;background:color-mix(in oklab,var(--primary) 12%,transparent);color:var(--primary);display:grid;place-items:center;flex-shrink:0}
.tb .tbt{font-weight:800;font-size:14.5px}
.tb .tbs{font-size:12px;color:var(--text-3)}

/* reviews */
.revgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.rev{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px}
.rev .rhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.rev .rav{width:42px;height:42px;border-radius:999px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:800}
.rev .rtext{font-size:14px;color:var(--text-2);line-height:1.7}

/* ═══════════════ Shop layout ═══════════════ */
.shop{display:grid;grid-template-columns:264px 1fr;gap:28px;margin-top:26px;align-items:start}
.filters{position:sticky;top:96px}
.fbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-bottom:16px}
.fbox h4{margin:0 0 14px;font-size:15px;font-weight:800}
.flist{display:flex;flex-direction:column;gap:2px}
.frow{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--text-2);transition:.12s}
.frow:hover{background:var(--surface-2)}
.frow.active{background:color-mix(in oklab,var(--primary) 12%,transparent);color:var(--primary)}
.frow .fc{font-family:'Tajawal';font-size:11px;color:var(--text-4)}
.shophead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.shophead h2{margin:0;font-size:24px;font-weight:800}
.shophead .sc{font-size:13px;color:var(--text-3);margin-top:2px}
.sel{border:1px solid var(--border-strong);background:var(--surface);border-radius:11px;padding:9px 12px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer}
.range{width:100%;accent-color:var(--primary)}

/* ═══════════════ Product detail ═══════════════ */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:26px;align-items:start}
.pd .pdart{position:sticky;top:96px;border-radius:var(--r-xl);overflow:hidden;height:440px}
.pd .thumbs{display:flex;gap:10px;margin-top:12px}
.pd .thumb{width:72px;height:72px;border-radius:14px;overflow:hidden;border:2px solid var(--border);cursor:pointer}
.pd .thumb.on{border-color:var(--primary)}
.pd h1{font-size:28px;font-weight:900;margin:6px 0 6px;letter-spacing:-.5px}
.pd .pden{font-size:15px;color:var(--text-3);margin-bottom:14px}
.pd .pdprice{display:flex;align-items:baseline;gap:10px;margin:18px 0}
.pd .pdprice .price{font-size:32px}
.opts{margin:20px 0}
.opts .ol{font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:10px}
.qtybox{display:inline-flex;align-items:center;border:1px solid var(--border-strong);border-radius:14px;overflow:hidden}
.qtybox button{width:44px;height:44px;border:0;background:var(--surface);color:var(--text);font-size:18px;cursor:pointer}
.qtybox button:hover{background:var(--surface-2)}
.qtybox span{min-width:48px;text-align:center;font-weight:800;font-family:'Tajawal'}
.pdactions{display:flex;gap:12px;margin-top:22px}
.pdfeat{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.pdfeat .pf{display:flex;gap:10px;align-items:center;padding:14px;background:var(--surface-2);border-radius:var(--r-md);font-size:13px;font-weight:600}
.pdfeat .pf svg{color:var(--primary);flex-shrink:0}

/* ═══════════════ Cart / Checkout ═══════════════ */
.cartlay{display:grid;grid-template-columns:1fr 360px;gap:28px;margin-top:26px;align-items:start}
.citem{display:flex;gap:16px;padding:16px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);margin-bottom:14px}
.citem .cart-art{width:104px;height:104px;border-radius:var(--r-md);overflow:hidden;flex-shrink:0}
.citem .cinfo{flex:1;min-width:0}
.citem .cname{font-weight:700;font-size:15px}
.citem .copt{font-size:12px;color:var(--text-3);margin-top:2px}
.citem .cbot{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.summary{position:sticky;top:96px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px}
.summary h3{margin:0 0 18px;font-size:18px;font-weight:800}
.srow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:14px;color:var(--text-2)}
.srow.total{border-top:1px dashed var(--border-strong);margin-top:8px;padding-top:16px;font-size:18px;font-weight:800;color:var(--text)}
.coupon{display:flex;gap:8px;margin:14px 0}
.input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;font-family:inherit;font-size:14.5px;color:var(--text);outline:none}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in oklab,var(--primary) 14%,transparent)}
.empty{text-align:center;padding:80px 20px}
.empty .eic{width:96px;height:96px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 20px;color:var(--text-4)}
.empty h3{font-size:20px;margin:0 0 8px}
.empty p{color:var(--text-3);margin:0 0 22px}

.coform{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.coform .full{grid-column:1/-1}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:var(--text-2)}
.optrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;margin-bottom:10px;transition:.15s}
.optrow:hover{border-color:var(--border-strong)}
.optrow.on{border-color:var(--primary);background:color-mix(in oklab,var(--primary) 6%,transparent)}
.optrow .radio{width:20px;height:20px;border-radius:999px;border:2px solid var(--border-strong);flex-shrink:0;position:relative}
.optrow.on .radio{border-color:var(--primary)}
.optrow.on .radio::after{content:'';position:absolute;inset:3px;border-radius:999px;background:var(--primary)}

.steps{display:flex;align-items:center;gap:8px;margin:24px 0 8px}
.step{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--text-4)}
.step .sn{width:26px;height:26px;border-radius:999px;background:var(--surface-3);color:var(--text-3);display:grid;place-items:center;font-size:13px;font-family:'Tajawal'}
.step.on{color:var(--primary)}
.step.on .sn{background:var(--primary);color:var(--primary-ink)}

let cart=LS.get('smw.cart',[]);
let favs=new Set(LS.get('smw.favs',[]));
let theme=LS.get('smw.theme','light');
document.documentElement.dataset.theme=theme;
const money=n=>n.toLocaleString('en-US');
const cartCount=()=>cart.reduce((s,i)=>s+i.qty,0);
const cartSub=()=>cart.reduce((s,i)=>s+i.p.price*i.qty,0);

function addToCart(id,qty=1,opt={}){
 const p=byId(id); if(!p)return;
 const key=id+'|'+(opt.grind||'')+'|'+(opt.size||'');
 const ex=cart.find(x=>x.key===key);
 if(ex)ex.qty+=qty; else cart.push({key,p,qty,opt});
 LS.set('smw.cart',cart); syncBadges(); toast(ic('check',{size:18,color:'#7be0a8'})+'أُضيف إلى السلة');
}
function setQty(key,q){const it=cart.find(x=>x.key===key);if(!it)return;it.qty=Math.max(1,q);LS.set('smw.cart',cart);syncBadges();}
function removeItem(key){cart=cart.filter(x=>x.key!==key);LS.set('smw.cart',cart);syncBadges();}
function toggleFav(id){if(favs.has(id))favs.delete(id);else favs.add(id);LS.set('smw.favs',[...favs]);syncBadges();}

function toast(html){
 let t=document.createElement('div');t.className='toast';t.innerHTML=html;document.body.appendChild(t);
 setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(()=>t.remove(),300)},1900);
}
function syncBadges(){
 document.querySelectorAll('[data-cartbadge]').forEach(e=>{const n=cartCount();e.textContent=n;e.style.display=n?'grid':'none'});
 document.querySelectorAll('[data-favbadge]').forEach(e=>{const n=favs.size;e.textContent=n;e.style.display=n?'grid':'none'});
}

let heroTimer=null;
function render(){
 clearInterval(heroTimer);
 const hash=location.hash||'#/';
 const parts=hash.slice(2).split('/'); // after '#/'
 const app=document.getElementById('app');
 // Dashboards are full-screen views with their own chrome
 if(parts[0]==='admin'||parts[0]==='vendor'){
   document.getElementById('topbar').innerHTML='';
   document.getElementById('footer').innerHTML='';
   app.innerHTML=parts[0]==='admin'?pageAdmin(parts[1]):pageVendor(parts[1]);
   window.scrollTo(0,0);
   return;
 }
 document.getElementById('topbar').innerHTML=header();
 document.getElementById('footer').innerHTML=footer();
 let html='';
 if(parts[0]===''||parts[0]==='home')html=pageHome();
 else if(parts[0]==='shop')html=pageShop(parts[1]);
 else if(parts[0]==='product')html=pageProduct(parts[1]);
 else if(parts[0]==='cart')html=pageCart();
 else if(parts[0]==='checkout')html=pageCheckout();
 else if(parts[0]==='success')html=pageSuccess();
 else if(parts[0]==='orders')html=pageOrders();
 else if(parts[0]==='favorites')html=pageFavorites();
 else if(parts[0]==='account')html=pageAccount();
 else html=pageHome();
 app.innerHTML=html;
 syncBadges();
 window.scrollTo(0,0);
 if(parts[0]===''||parts[0]==='home')startHero();
 // restore search box value
 const q=document.getElementById('q'); if(q&&shopState.q&&parts[0]==='shop')q.value=shopState.q;
}
function nav(hash){if(hash!==location.hash)location.hash=hash;else render();}

function startHero(){
 let i=0;const slides=document.querySelectorAll('.hero-slide'),dots=document.querySelectorAll('[data-dot]');
 if(!slides.length)return;
 const show=n=>{slides.forEach((s,k)=>s.classList.toggle('on',k===n));dots.forEach((d,k)=>d.classList.toggle('on',k===n));i=n};
 heroTimer=setInterval(()=>show((i+1)%slides.length),5000);
}

/* ═══════════════════ EVENTS ═══════════════════ */
function closeMega(){const m=document.getElementById('megamenu');if(m)m.classList.remove('open');document.querySelectorAll('[data-megatoggle]').forEach(b=>b.classList.remove('open'));}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-nav],[data-add],[data-fav],[data-buy],[data-remove],[data-cq],[data-q],[data-grind],[data-rating],[data-vendor],[data-pay],[data-dot],[data-theme-toggle],[data-coupon],[data-megatoggle]');
 // close mega menu on any click outside it (and outside its toggle)
 if(!e.target.closest('#megamenu')&&!e.target.closest('[data-megatoggle]'))closeMega();
 if(!t)return;
 if(t.hasAttribute('data-megatoggle')){e.stopPropagation();const m=document.getElementById('megamenu');const open=m.classList.toggle('open');document.querySelectorAll('[data-megatoggle]').forEach(b=>b.classList.toggle('open',open));return;}
 if(t.hasAttribute('data-nav')){closeMega();nav(t.getAttribute('data-nav'));return;}
 if(t.hasAttribute('data-theme-toggle')){theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;LS.set('smw.theme',theme);document.getElementById('topbar').innerHTML=header();syncBadges();return;}
 if(t.hasAttribute('data-add')){e.stopPropagation();addToCart(t.getAttribute('data-add'));return;}
 if(t.hasAttribute('data-fav')){e.stopPropagation();const id=t.getAttribute('data-fav');toggleFav(id);
   // update icon in place
   const on=favs.has(id);t.innerHTML=on?ic('heart_f',{size:t.closest('.pdactions')?20:16,color:'#C2392C'}):ic('heart',{size:t.closest('.pdactions')?20:16});return;}
 if(t.hasAttribute('data-buy')){addToCart(t.getAttribute('data-buy'),pdState.qty,{grind:pdState.grind});return;}
 if(t.hasAttribute('data-remove')){removeItem(t.getAttribute('data-remove'));render();return;}
 if(t.hasAttribute('data-cq')){const[key,op]=t.getAttribute('data-cq').split('|');const it=cart.find(x=>x.key===key);if(it){setQty(key,it.qty+(op==='+'?1:-1));render();}return;}
 if(t.hasAttribute('data-q')){const op=t.getAttribute('data-q');pdState.qty=Math.max(1,pdState.qty+(op==='+'?1:-1));document.getElementById('qv').textContent=pdState.qty;return;}
 if(t.hasAttribute('data-grind')){pdState.grind=t.getAttribute('data-grind');document.querySelectorAll('[data-grind]').forEach(c=>c.classList.remove('active'));t.classList.add('active');return;}
 if(t.hasAttribute('data-rating')){shopState.minRating=parseFloat(t.getAttribute('data-rating'));render();return;}
 if(t.hasAttribute('data-vendor')){shopState.vendor=t.getAttribute('data-vendor')||null;if((location.hash||'#/').indexOf('#/shop')!==0){nav('#/shop');}else{render();}return;}
 if(t.hasAttribute('data-pay')){document.querySelectorAll('[data-pay]').forEach(r=>r.classList.remove('on'));t.classList.add('on');return;}
 if(t.hasAttribute('data-dot')){const n=+t.getAttribute('data-dot');document.querySelectorAll('.hero-slide').forEach((s,k)=>s.classList.toggle('on',k===n));document.querySelectorAll('[data-dot]').forEach((d,k)=>d.classList.toggle('on',k===n));return;}
 if(t.hasAttribute('data-coupon')){const c=document.getElementById('coupon');toast(ic('gift',{size:18,color:'#7be0a8'})+(c&&c.value.trim()?'كود غير صالح — جرّب SUDAN10':'أدخل كود الخصم'));return;}
});
document.addEventListener('input',e=>{
 if(e.target.hasAttribute('data-price')){shopState.maxPrice=+e.target.value;const pv=document.getElementById('pv');if(pv)pv.textContent=shopState.maxPrice+' ر.س';clearTimeout(window._pt);window._pt=setTimeout(render,250);}
 if(e.target.hasAttribute('data-sort')){shopState.sort=e.target.value;render();}
});
document.addEventListener('change',e=>{if(e.target.hasAttribute('data-sort')){shopState.sort=e.target.value;render();}});
document.addEventListener('submit',e=>{
 if(e.target.hasAttribute('data-search')){e.preventDefault();const q=document.getElementById('q').value;shopState.q=q;shopState.cat=null;nav('#/shop');}
});
window.addEventListener('hashchange',render);
render();
</script>
